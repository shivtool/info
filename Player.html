<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kabhi Sham Dhale — Music Player</title>
<meta name="description" content="Shiv Computer ka fast, offline-ready glassmorphism music player — install karke app jaisa istemal karein.">

<!-- PWA core -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="background-color" content="#0f172a">
<meta name="color-scheme" content="dark">

<!-- Icons -->
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="shortcut icon" href="icons/icon-192.png">

<!-- iOS standalone app behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Music Player">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://raw.githubusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root{
    --cyan:#38bdf8;
    --indigo:#818cf8;
    --pink:#f472b6;
    --amber:#fbbf24;
    --green:#34d399;
    --red:#f87171;
    --gold:#facc15;
    --bg1:#0f172a;
    --bg2:#1e1b4b;
    --bg3:#31103f;
  }

  body {
    font-family: 'Poppins', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px;
    overflow-x: hidden;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .player-container {
    width: 100%;
    max-width: 420px;
    background: rgba(30, 41, 59, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 26px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.2);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }

  /* animated rotating rainbow border glow, only visible while lights are on */
  .player-container::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 28px;
    padding: 2px;
    background: conic-gradient(from 0deg, var(--cyan), var(--indigo), var(--pink), var(--amber), var(--green), var(--cyan));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.5s ease;
    z-index: -1;
    animation: rotate-border 5s linear infinite;
  }
  .player-container.lights-on::before { opacity: 0.55; }
  .player-container.lights-on.is-playing::before { opacity: 0.9; }
  @keyframes rotate-border {
    to { transform: rotate(360deg); }
  }

  /* subtle glass shine highlight across the top */
  .player-container::after {
    content: '';
    position: absolute;
    top: -60%;
    left: -20%;
    width: 60%;
    height: 220%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.08), transparent);
    transform: rotate(20deg);
    pointer-events: none;
    z-index: 0;
  }

  .player-container > * { position: relative; z-index: 1; }

  /* --------- Header --------- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header-text h1 {
    font-family: 'Rajdhani', 'Poppins', sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, var(--cyan), var(--indigo), var(--pink));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: title-shine 6s linear infinite;
    filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.35));
  }
  @keyframes title-shine {
    to { background-position: 200% center; }
  }

  .header-text p {
    font-size: 0.75rem;
    color: #94a3b8;
    margin-top: 2px;
    letter-spacing: 0.3px;
  }

  .lights-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 10px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 0.7rem;
    color: #cbd5e1;
    transition: all 0.25s ease;
    user-select: none;
    white-space: nowrap;
  }
  .lights-toggle:hover { border-color: var(--cyan); }
  .lights-toggle .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #475569;
    box-shadow: none;
    transition: all 0.3s ease;
  }
  .lights-toggle.on .dot {
    background: var(--green);
    box-shadow: 0 0 8px var(--green), 0 0 16px var(--green);
    animation: dotBlink 1.4s infinite ease-in-out;
  }
  @keyframes dotBlink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .sync-btn {
    background: linear-gradient(135deg, var(--cyan), var(--indigo));
    color: #0f172a;
    border: none;
    padding: 11px 15px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    transition: all 0.3s ease;
    text-align: center;
    width: 100%;
    position: relative;
    overflow: hidden;
  }
  .sync-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -75%;
    width: 50%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
  }
  .sync-btn:hover::before { left: 125%; }
  .sync-btn:hover {
    transform: scale(1.02);
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.7);
  }
  .sync-btn:active { transform: scale(0.98); }

  /* --------- PWA install button --------- */
  .install-btn {
    background: linear-gradient(135deg, var(--green), var(--gold));
    color: #0f172a;
    border: none;
    padding: 10px 15px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 0.8rem;
    font-family: 'Poppins', sans-serif;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(52, 211, 153, 0.35);
    transition: all 0.3s ease;
    text-align: center;
    width: 100%;
  }
  .install-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(250, 204, 21, 0.55); }
  .install-btn:active { transform: scale(0.98); }
  .hidden { display: none !important; }

  /* --------- Visualizer / Stage --------- */
  .stage {
    width: 100%;
    background: radial-gradient(circle at 50% 30%, rgba(56,189,248,0.18) 0%, rgba(15,23,42,0.9) 75%);
    border-radius: 18px;
    border: 1px solid rgba(56, 189, 248, 0.3);
    position: relative;
    padding: 16px 14px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    overflow: hidden;
  }

  /* floating musical notes drifting upward in the background, only when playing */
  .float-notes {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .float-notes span {
    position: absolute;
    bottom: -10%;
    font-size: 0.9rem;
    opacity: 0;
    color: var(--cyan);
  }
  .is-playing.lights-on .float-notes span {
    animation: float-up 6s linear infinite;
  }
  .float-notes span:nth-child(1) { left: 8%;  color: var(--cyan);   animation-delay: 0s;   font-size: 0.8rem; }
  .float-notes span:nth-child(2) { left: 28%; color: var(--pink);   animation-delay: 1.4s; font-size: 1rem; }
  .float-notes span:nth-child(3) { left: 52%; color: var(--amber);  animation-delay: 2.6s; font-size: 0.75rem; }
  .float-notes span:nth-child(4) { left: 70%; color: var(--indigo); animation-delay: 0.8s; font-size: 0.95rem; }
  .float-notes span:nth-child(5) { left: 88%; color: var(--green);  animation-delay: 3.4s; font-size: 0.8rem; }
  @keyframes float-up {
    0%   { transform: translateY(0) rotate(0deg);   opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-140px) rotate(25deg); opacity: 0; }
  }

  /* rainbow ambient glow strip along top, only alive when lights on */
  .glow-strip {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--cyan), var(--indigo), var(--pink), var(--amber), var(--green), var(--cyan));
    background-size: 300% 100%;
    opacity: 0.25;
  }
  .lights-on .glow-strip {
    opacity: 1;
    animation: strip-move 3s linear infinite;
  }
  @keyframes strip-move {
    0% { background-position: 0% 0%; }
    100% { background-position: 300% 0%; }
  }

  .disc-row {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    position: relative;
    z-index: 1;
  }

  .disc {
    width: 66px;
    height: 66px;
    flex-shrink: 0;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, #1e293b 0px, #1e293b 2px, #0f172a 3px, #0f172a 5px),
      radial-gradient(circle at 35% 30%, #475569, #0f172a 75%);
    border: 3px solid rgba(56,189,248,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 0 0 rgba(56,189,248,0);
    transition: box-shadow 0.4s ease;
    overflow: hidden;
  }
  .disc::before {
    content: '';
    position: absolute;
    top: -20%;
    left: -60%;
    width: 40%;
    height: 140%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent);
    transform: rotate(25deg);
  }
  .disc::after {
    content: '';
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #1e293b;
    border: 2px solid var(--cyan);
    box-shadow: 0 0 6px rgba(56,189,248,0.6);
    z-index: 1;
  }
  .disc .note {
    position: absolute;
    font-size: 1.05rem;
    z-index: 1;
    filter: drop-shadow(0 0 4px rgba(56,189,248,0.6));
  }
  .disc.spinning {
    animation: spin 5s linear infinite;
  }
  .lights-on .disc.spinning {
    box-shadow: 0 0 18px rgba(56,189,248,0.6), 0 0 36px rgba(129,140,248,0.35);
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .track-info {
    flex: 1;
    min-width: 0;
  }

  .current-title {
    font-family: 'Rajdhani', 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.35));
  }

  #titleText {
    display: inline-block;
  }
  .current-title.shine #titleText {
    background: linear-gradient(90deg, #f8fafc, var(--cyan), var(--pink), #f8fafc);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: title-flow 4s linear infinite;
  }

  @keyframes title-flow {
    to { background-position: 300% center; }
  }

  /* each letter fades + rises into place, one after another, in its own bright colour */
  .letter {
    display: inline-block;
    white-space: pre;
    color: #f8fafc;
    opacity: 0;
    transform: translateY(8px) scale(0.85);
    animation: letter-in 0.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    text-shadow: 0 0 8px currentColor;
  }
  @keyframes letter-in {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .caret {
    display: inline-block;
    width: 2px;
    margin-left: 2px;
    color: var(--cyan);
    -webkit-text-fill-color: var(--cyan);
    animation: caret-blink 0.8s step-end infinite;
  }
  .caret.hidden { display: none; }
  @keyframes caret-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  .current-artist {
    font-size: 0.72rem;
    color: #94a3b8;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-msg {
    font-size: 0.68rem;
    color: var(--cyan);
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-msg .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cyan);
  }

  /* --------- Equalizer bars (colourful blinking lights) --------- */
  .equalizer {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 34px;
    width: 100%;
    justify-content: center;
    padding-top: 2px;
    position: relative;
    z-index: 1;
  }
  .equalizer .bar {
    width: 6px;
    border-radius: 4px 4px 0 0;
    height: 8px;
    background: #475569;
    transition: background 0.3s ease, opacity 0.3s ease;
    opacity: 0.5;
  }
  .equalizer .bar:nth-child(1) { background: var(--cyan); }
  .equalizer .bar:nth-child(2) { background: var(--indigo); }
  .equalizer .bar:nth-child(3) { background: var(--pink); }
  .equalizer .bar:nth-child(4) { background: var(--amber); }
  .equalizer .bar:nth-child(5) { background: var(--green); }
  .equalizer .bar:nth-child(6) { background: var(--indigo); }
  .equalizer .bar:nth-child(7) { background: var(--cyan); }

  .lights-on .equalizer .bar { opacity: 1; }

  .lights-on.is-playing .equalizer .bar:nth-child(1) { animation: eq 0.62s ease-in-out infinite alternate; }
  .lights-on.is-playing .equalizer .bar:nth-child(2) { animation: eq 0.48s ease-in-out infinite alternate; animation-delay: 0.1s; }
  .lights-on.is-playing .equalizer .bar:nth-child(3) { animation: eq 0.71s ease-in-out infinite alternate; animation-delay: 0.05s; }
  .lights-on.is-playing .equalizer .bar:nth-child(4) { animation: eq 0.55s ease-in-out infinite alternate; animation-delay: 0.2s; }
  .lights-on.is-playing .equalizer .bar:nth-child(5) { animation: eq 0.65s ease-in-out infinite alternate; animation-delay: 0.12s; }
  .lights-on.is-playing .equalizer .bar:nth-child(6) { animation: eq 0.5s ease-in-out infinite alternate; animation-delay: 0.22s; }
  .lights-on.is-playing .equalizer .bar:nth-child(7) { animation: eq 0.6s ease-in-out infinite alternate; animation-delay: 0.08s; }

  @keyframes eq {
    0% { height: 6px; }
    100% { height: 32px; }
  }

  /* --------- Progress bar / status bar (YouTube style) --------- */
  .progress-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .progress-track {
    position: relative;
    width: 100%;
    height: 14px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }

  .progress-bg {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--indigo));
    border-radius: 4px;
    position: relative;
    transition: width 0.1s linear;
  }
  .lights-on .progress-fill {
    background: linear-gradient(90deg, var(--cyan), var(--indigo), var(--pink));
    box-shadow: 0 0 8px rgba(56,189,248,0.7);
  }

  .progress-thumb {
    position: absolute;
    top: 50%;
    width: 13px;
    height: 13px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(56,189,248,0.8);
    transform: translate(-50%, -50%);
    left: 0%;
    pointer-events: none;
  }
  .is-playing .progress-thumb {
    animation: thumb-pulse 1.2s ease-in-out infinite;
  }
  @keyframes thumb-pulse {
    0%, 100% { box-shadow: 0 0 6px rgba(56,189,248,0.8); }
    50% { box-shadow: 0 0 12px rgba(129,140,248,1); }
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: #94a3b8;
    font-variant-numeric: tabular-nums;
  }

  /* --------- Controls --------- */
  .controls-section {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .main-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  .side-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e2e8f0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.2s ease;
  }
  .side-btn:hover {
    background: rgba(56,189,248,0.2);
    border-color: var(--cyan);
  }

  .play-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--cyan), var(--indigo));
    border: none;
    color: #0f172a;
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(56,189,248,0.5);
    transition: all 0.2s ease;
    position: relative;
  }
  .is-playing .play-btn {
    box-shadow: 0 0 20px rgba(56,189,248,0.5), 0 0 0 6px rgba(56,189,248,0.12);
  }
  .play-btn:hover { transform: scale(1.08); }
  .play-btn:active { transform: scale(0.94); }

  .volume-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 4px;
  }

  .volume-row span { font-size: 0.9rem; color: #94a3b8; }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px rgba(56,189,248,0.8);
    cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--cyan);
    border: none;
    box-shadow: 0 0 8px rgba(56,189,248,0.8);
    cursor: pointer;
  }

  /* --------- Playlist --------- */
  .playlist-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    color: #94a3b8;
    padding: 0 2px;
  }

  .playlist-wrapper {
    max-height: 150px;
    overflow-y: auto;
    padding-right: 2px;
  }

  .playlist-wrapper::-webkit-scrollbar { width: 4px; }
  .playlist-wrapper::-webkit-scrollbar-thumb {
    background: rgba(56, 189, 248, 0.3);
    border-radius: 8px;
  }

  .playlist {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .playlist-item {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-left: 3px solid transparent;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    transition: all 0.25s ease;
  }

  .playlist-item:hover {
    background: rgba(56, 189, 248, 0.1);
    border-color: rgba(56, 189, 248, 0.4);
    border-left-color: var(--indigo);
    transform: translateX(3px);
  }

  .playlist-item.active {
    background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(129, 140, 248, 0.25));
    border-color: var(--cyan);
    border-left-color: var(--cyan);
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
  }

  .track-num {
    font-size: 0.7rem;
    color: #64748b;
    width: 18px;
    flex-shrink: 0;
  }
  .playlist-item.active .track-num { color: var(--cyan); }

  .track-name {
    font-size: 0.8rem;
    color: #e2e8f0;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .playlist-item.active .track-name {
    color: var(--cyan);
    font-weight: 700;
  }

  .mini-eq {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
    opacity: 0;
  }
  .playlist-item.active .mini-eq { opacity: 1; }
  .mini-eq span {
    width: 3px;
    background: var(--cyan);
    border-radius: 2px;
    height: 4px;
  }
  .playlist-item.active.is-playing-item .mini-eq span:nth-child(1) { animation: eq 0.5s ease-in-out infinite alternate; }
  .playlist-item.active.is-playing-item .mini-eq span:nth-child(2) { animation: eq 0.4s ease-in-out infinite alternate; animation-delay: 0.15s; }
  .playlist-item.active.is-playing-item .mini-eq span:nth-child(3) { animation: eq 0.6s ease-in-out infinite alternate; animation-delay: 0.05s; }
</style>
</head>
<body>

<div class="player-container" id="playerContainer">
  <div class="header">
    <div class="header-text">
      <h1>🎵 Kabhi Sham Dhale</h1>
      <p>Music Player</p>
    </div>
    <div class="lights-toggle on" id="lightsToggle">
      <span class="dot"></span>
      <span id="lightsLabel">Lights ON</span>
    </div>
  </div>

  <button class="install-btn hidden" id="installBtn" title="App Install Karein">⬇️ App Install करें</button>

  <button class="sync-btn" id="syncBtn">📁 लोकल गानों का फोल्डर चुनें (Auto-Sync)</button>
  <input type="file" id="fileInput" webkitdirectory directory multiple style="display: none;">

  <div class="stage" id="stage">
    <div class="glow-strip"></div>
    <div class="float-notes">
      <span>♪</span><span>♫</span><span>♪</span><span>♬</span><span>♫</span>
    </div>

    <div class="disc-row">
      <div class="disc" id="disc"><span class="note">🎧</span></div>
      <div class="track-info">
        <div class="current-title" id="displayTitle"><span id="titleText">गाना चुनें या फोल्डर सिंक करें</span><span class="caret" id="titleCaret"></span></div>
        <div class="current-artist" id="displayArtist">—</div>
        <div class="status-msg"><span class="live-dot"></span><span id="statusMsg">तैयार है</span></div>
      </div>
    </div>

    <div class="equalizer" id="equalizer">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <div class="progress-section">
    <div class="progress-track" id="progressTrack">
      <div class="progress-bg">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>
    <div class="time-row">
      <span id="currentTime">0:00</span>
      <span id="durationTime">0:00</span>
    </div>
  </div>

  <div class="controls-section">
    <div class="main-controls">
      <button class="side-btn" id="prevBtn" title="Previous">⏮</button>
      <button class="play-btn" id="playBtn" title="Play/Pause">▶</button>
      <button class="side-btn" id="nextBtn" title="Next">⏭</button>
    </div>
    <div class="volume-row">
      <span id="volIcon">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="100">
    </div>
  </div>

  <audio id="audioPlayer" preload="auto"></audio>

  <div class="playlist-header">
    <span>Playlist</span>
    <span id="playlistCount">0 गाने</span>
  </div>
  <div class="playlist-wrapper">
    <ul class="playlist" id="playlist"></ul>
  </div>
</div>

<script>
  let tracks = [
    {
      "title": "001 Kabhi Sham Dhale to Mere Dil Men (Suno 1)",
      "artist": "Suno.com",
      "url": "https://github.com/shivtool/music/raw/refs/heads/main/%E0%A4%95%E0%A4%AD%E0%A5%80%20%E0%A4%B6%E0%A4%BE%E0%A4%AE%20%E0%A4%A2%E0%A4%B2%E0%A5%87%20%E0%A4%A4%E0%A5%8B%20%E0%A4%AE%E0%A5%87%E0%A4%B0%E0%A5%87%20%E0%A4%A6%E0%A4%BF%E0%A4%B2%20%E0%A4%AE%E0%A5%87%E0%A4%82%20%E0%A4%86%20%E0%A4%9C%E0%A4%BE%E0%A4%A8%E0%A4%BE%20(1).mp3"
    },
    {
      "title": "002 Kabhi Sham Dhale to Mere Dil Men (Suno 2)",
      "artist": "Suno.com",
      "url": "https://suno.com/s/bBq3tURdfAGi2yxd"
    },
    {
      "title": "003 Kabhi Sham Dhale to Mere Dil Men (Suno 3)",
      "artist": "Suno.com",
      "url": "https://github.com/shivtool/music/raw/refs/heads/main/%E0%A4%95%E0%A4%AD%E0%A5%80%20%E0%A4%B6%E0%A4%BE%E0%A4%AE%20%E0%A4%A2%E0%A4%B2%E0%A5%87%20%E0%A4%A4%E0%A5%8B%20%E0%A4%AE%E0%A5%87%E0%A4%B0%E0%A5%87%20%E0%A4%A6%E0%A4%BF%E0%A4%B2%20%E0%A4%AE%E0%A5%87%E0%A4%82%20%E0%A4%86%20%E0%A4%9C%E0%A4%BE%E0%A4%A8%E0%A4%BE%20(2).mp3"
    },
    {
      "title": "004 Kabhi Sham Dhale to Mere Dil Men (Suno 4)",
      "artist": "Suno.com",
      "url": "https://github.com/shivtool/music/raw/refs/heads/main/%E0%A4%95%E0%A4%AD%E0%A5%80%20%E0%A4%B6%E0%A4%BE%E0%A4%AE%20%E0%A4%A2%E0%A4%B2%E0%A5%87%20%E0%A4%A4%E0%A5%8B%20%E0%A4%AE%E0%A5%87%E0%A4%B0%E0%A5%87%20%E0%A4%A6%E0%A4%BF%E0%A4%B2%20%E0%A4%AE%E0%A5%87%E0%A4%82%20%E0%A4%86%20%E0%A4%9C%E0%A4%BE%E0%A4%A8%E0%A4%BE%20(3).mp3"
    },
    {
      "title": "005 Kabhi Sham Dhale to Mere Dil Men (Suno 5)",
      "artist": "Suno.com",
      "url": "https://github.com/shivtool/music/raw/refs/heads/main/%E0%A4%95%E0%A4%AD%E0%A5%80%20%E0%A4%B6%E0%A4%BE%E0%A4%AE%20%E0%A4%A2%E0%A4%B2%E0%A5%87%20%E0%A4%A4%E0%A5%8B%20%E0%A4%AE%E0%A5%87%E0%A4%B0%E0%A5%87%20%E0%A4%A6%E0%A4%BF%E0%A4%B2%20%E0%A4%AE%E0%A5%87%E0%A4%82%20%E0%A4%86%20%E0%A4%9C%E0%A4%BE%E0%A4%A8%E0%A4%BE.mp3"
    }
  ];

  const audioPlayer   = document.getElementById('audioPlayer');
  const playlistEl    = document.getElementById('playlist');
  const playlistCount = document.getElementById('playlistCount');
  const displayTitle  = document.getElementById('displayTitle');
  const titleText     = document.getElementById('titleText');
  const titleCaret    = document.getElementById('titleCaret');
  const displayArtist = document.getElementById('displayArtist');
  const statusMsg     = document.getElementById('statusMsg');
  const disc          = document.getElementById('disc');
  const stage         = document.getElementById('stage');
  const syncBtn       = document.getElementById('syncBtn');
  const fileInput     = document.getElementById('fileInput');
  const prevBtn       = document.getElementById('prevBtn');
  const nextBtn       = document.getElementById('nextBtn');
  const playBtn       = document.getElementById('playBtn');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill  = document.getElementById('progressFill');
  const progressThumb = document.getElementById('progressThumb');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl    = document.getElementById('durationTime');
  const volumeSlider  = document.getElementById('volumeSlider');
  const volIcon       = document.getElementById('volIcon');
  const lightsToggle  = document.getElementById('lightsToggle');
  const lightsLabel   = document.getElementById('lightsLabel');
  const playerContainer = document.getElementById('playerContainer');

  let currentTrackIndex = 0;
  let lightsOn = true;
  let isSeeking = false;
  let shineTimer = null;

  // ---------- Stylish letter-by-letter cascade effect for now-playing title ----------
  const letterColors = ['#38bdf8', '#818cf8', '#f472b6', '#fbbf24', '#34d399'];

  function typeTitle(text) {
    if (shineTimer) clearTimeout(shineTimer);
    displayTitle.classList.remove('shine');
    titleCaret.classList.remove('hidden');
    titleText.innerHTML = '';

    const chars = Array.from(text);
    // slower per-letter delay for short titles, faster (but still visible) for long ones
    const perLetterDelay = Math.max(28, Math.min(55, 1400 / Math.max(chars.length, 1)));

    chars.forEach((ch, idx) => {
      const span = document.createElement('span');
      span.className = 'letter';
      span.textContent = (ch === ' ') ? '\u00A0' : ch;
      span.style.animationDelay = (idx * perLetterDelay) + 'ms';
      span.style.color = letterColors[idx % letterColors.length];
      titleText.appendChild(span);
    });

    const totalTime = chars.length * perLetterDelay + 450;
    shineTimer = setTimeout(() => {
      // typing finished — settle into one smooth flowing gradient title
      titleText.textContent = text;
      displayTitle.classList.add('shine');
    }, totalTime);
  }

  // ---------- Blinking colourful lights toggle ----------
  lightsToggle.addEventListener('click', () => {
    lightsOn = !lightsOn;
    lightsToggle.classList.toggle('on', lightsOn);
    playerContainer.classList.toggle('lights-on', lightsOn);
    lightsLabel.innerText = lightsOn ? 'Lights ON' : 'Lights OFF';
  });
  // lights ON by default
  playerContainer.classList.add('lights-on');

  // ---------- Folder picker ----------
  syncBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (event) => {
    const files = event.target.files;
    let localTracks = [];

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      if (file.type.startsWith('audio/') || file.name.endsWith('.mp3') || file.name.endsWith('.wav')) {
        localTracks.push({
          title: file.name,
          artist: "Local Storage",
          url: URL.createObjectURL(file)
        });
      }
    }

    if (localTracks.length > 0) {
      tracks = localTracks;
      statusMsg.innerText = `${tracks.length} गाने सिंक हो गए`;
      renderPlaylist();
      playTrack(0);
    } else {
      statusMsg.innerText = "कोई ऑडियो फाइल नहीं मिली!";
    }
  });

  function renderPlaylist() {
    playlistEl.innerHTML = '';
    playlistCount.innerText = `${tracks.length} गाने`;

    tracks.forEach((track, index) => {
      const li = document.createElement('li');
      const isActive = index === currentTrackIndex;
      li.className = `playlist-item ${isActive ? 'active' : ''} ${isActive && !audioPlayer.paused ? 'is-playing-item' : ''}`;
      li.innerHTML = `
        <span class="track-num">${String(index + 1).padStart(2, '0')}</span>
        <span class="track-name">${track.title}</span>
        <span class="mini-eq"><span></span><span></span><span></span></span>
      `;
      li.addEventListener('click', () => playTrack(index));
      playlistEl.appendChild(li);
    });
  }

  function playTrack(index) {
    if (tracks.length === 0) return;

    currentTrackIndex = index;
    const track = tracks[index];

    if (!track.url || track.url.trim() === "") {
      typeTitle(track.title);
      displayArtist.innerText = track.artist || '—';
      statusMsg.innerText = "कृपया Suno लिंक जोड़ें!";
      return;
    }

    typeTitle(track.title);
    displayArtist.innerText = track.artist || '—';
    statusMsg.innerText = "लोड हो रहा है...";

    audioPlayer.src = track.url;
    audioPlayer.load();

    audioPlayer.play().then(() => {
      statusMsg.innerText = "चल रहा है";
    }).catch(err => {
      console.error("Playback Error:", err);
      statusMsg.innerText = "प्लेबैक त्रुटि";
    });

    updateMediaSession(track);
    renderPlaylist();
  }

  // ---------- Prev / Next ----------
  prevBtn.addEventListener('click', () => {
    if (tracks.length === 0) return;
    let newIndex = currentTrackIndex - 1;
    if (newIndex < 0) newIndex = tracks.length - 1;
    playTrack(newIndex);
  });

  nextBtn.addEventListener('click', () => {
    if (tracks.length === 0) return;
    let newIndex = currentTrackIndex + 1;
    if (newIndex >= tracks.length) newIndex = 0;
    playTrack(newIndex);
  });

  // ---------- Play / Pause button ----------
  playBtn.addEventListener('click', () => {
    if (!audioPlayer.src) {
      if (tracks.length > 0) playTrack(0);
      return;
    }
    if (audioPlayer.paused) {
      audioPlayer.play();
    } else {
      audioPlayer.pause();
    }
  });

  audioPlayer.addEventListener('play', () => {
    playBtn.innerText = '⏸';
    disc.classList.add('spinning');
    playerContainer.classList.add('is-playing');
    statusMsg.innerText = "चल रहा है";
    renderPlaylist();
  });

  audioPlayer.addEventListener('pause', () => {
    playBtn.innerText = '▶';
    disc.classList.remove('spinning');
    playerContainer.classList.remove('is-playing');
    statusMsg.innerText = "रुका हुआ";
    renderPlaylist();
  });

  // ---------- Progress bar (YouTube style seek) ----------
  function formatTime(sec) {
    if (!isFinite(sec) || isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  audioPlayer.addEventListener('loadedmetadata', () => {
    durationEl.innerText = formatTime(audioPlayer.duration);
  });

  audioPlayer.addEventListener('timeupdate', () => {
    if (isSeeking) return;
    const pct = audioPlayer.duration ? (audioPlayer.currentTime / audioPlayer.duration) * 100 : 0;
    progressFill.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
    durationEl.innerText = formatTime(audioPlayer.duration);
  });

  function seekFromEvent(clientX) {
    const rect = progressTrack.getBoundingClientRect();
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.min(1, Math.max(0, pct));
    progressFill.style.width = (pct * 100) + '%';
    progressThumb.style.left = (pct * 100) + '%';
    if (audioPlayer.duration) {
      audioPlayer.currentTime = pct * audioPlayer.duration;
      currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
    }
  }

  progressTrack.addEventListener('mousedown', (e) => {
    isSeeking = true;
    seekFromEvent(e.clientX);
  });
  window.addEventListener('mousemove', (e) => {
    if (isSeeking) seekFromEvent(e.clientX);
  });
  window.addEventListener('mouseup', () => { isSeeking = false; });

  progressTrack.addEventListener('touchstart', (e) => {
    isSeeking = true;
    seekFromEvent(e.touches[0].clientX);
  }, { passive: true });
  progressTrack.addEventListener('touchmove', (e) => {
    if (isSeeking) seekFromEvent(e.touches[0].clientX);
  }, { passive: true });
  progressTrack.addEventListener('touchend', () => { isSeeking = false; });

  // ---------- Volume ----------
  volumeSlider.addEventListener('input', () => {
    const v = volumeSlider.value / 100;
    audioPlayer.volume = v;
    volIcon.innerText = v === 0 ? '🔇' : (v < 0.5 ? '🔉' : '🔊');
  });

  // ---------- Media Session (lock screen / background) ----------
  function updateMediaSession(track) {
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: track.title,
        artist: track.artist,
        album: "Kabhi Sham Dhale"
      });
      navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
      navigator.mediaSession.setActionHandler('pause', () => audioPlayer.pause());
      navigator.mediaSession.setActionHandler('previoustrack', () => prevBtn.click());
      navigator.mediaSession.setActionHandler('nexttrack', () => nextBtn.click());
    }
  }

  // ---------- Auto next ----------
  audioPlayer.addEventListener('ended', () => nextBtn.click());

  // ---------- Init ----------
  renderPlaylist();

  // ---------- PWA: Service Worker registration (instant repeat loads) ----------
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }

  // ---------- PWA: Install prompt ----------
  const installBtn = document.getElementById('installBtn');
  let deferredInstallPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.classList.remove('hidden');
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredInstallPrompt) return;
    installBtn.classList.add('hidden');
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  });

  window.addEventListener('appinstalled', () => {
    installBtn.classList.add('hidden');
    statusMsg.innerText = 'ऐप इंस्टॉल हो गया 🎉';
  });

  // Already installed / running standalone → no need to show the install button
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
    installBtn.classList.add('hidden');
  }
</script>

</body>
</html>
